services:
  - type: web
    name: costlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: EXA_DSN
        sync: false
      - key: EXA_USER
        sync: false
      - key: EXA_PASSWORD
        sync: false
      - key: COSTLENS_SECRET
        generateValue: true
