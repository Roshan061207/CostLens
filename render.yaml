services:
  - type: web
    name: costlens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: COSTLENS_DEMO_PREVIEW
        value: "true"
      - key: COSTLENS_SECRET
        generateValue: true
